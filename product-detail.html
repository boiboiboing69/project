<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlueStone - Product Detail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;500;700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">BlueStone</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#products">Shop</a></li>
                <li><a href="customization.html">Customization</a></li>
                <li><a href="pricing.html">Pricing</a></li>
                <li><a href="checkout-flow.html">Checkout</a></li>
            </ul>
        </nav>
        <div class="search-bar">
            <input type="search" placeholder="Search...">
            <button>Search</button>
        </div>
        <div class="cart-icon"><a href="cart.html" style="text-decoration:none; color:inherit;">Cart <span class="cart-count-badge-dynamic" style="display:none;">0</span></a></div>
    </header>

    <main class="product-detail-container" data-product-id=""> <!-- data-product-id will be set by JS if needed for context -->
        <div class="product-image-gallery">
            <img src="https://via.placeholder.com/600x600/FDF9F5/1E1E1E?text=Product" alt="Product View" class="main-product-image" id="pdp-main-image">
            <div class="thumbnail-images" id="pdp-thumbnail-gallery" style="margin-top: 1rem;">
                <!-- Thumbnails will be dynamically inserted here by JavaScript -->
            </div>
        </div>
        <div class="product-details-info">
            <h1 id="pdp-product-name">Product Name</h1>
            <p class="product-detail-price" id="pdp-product-price">₹--</p>
            <div class="product-options">
                <label for="pdp-size-select">Size:</label>
                <select id="pdp-size-select" name="size"></select>

                <label for="pdp-metal-select" style="margin-top:1rem;">Metal:</label>
                <select id="pdp-metal-select" name="metal"></select>

                <!-- Add other attribute selects here if needed, e.g., stone, style -->
                <!-- Example:
                <label for="pdp-stone-select" style="margin-top:1rem;">Stone:</label>
                <select id="pdp-stone-select" name="stone"></select>
                -->
            </div>
             <div class="quantity-selector" style="margin-top:1.5rem; margin-bottom:1.5rem;">
                <label for="pdp-quantity" style="display:block; margin-bottom:0.5rem;">Quantity:</label>
                <input type="number" id="pdp-quantity" value="1" min="1" style="width: 60px; padding: 0.5rem; border-radius: 8px; border: 1px solid #ccc;">
            </div>
            <button class="btn btn-primary add-to-cart-primary-btn" id="pdp-add-to-cart-btn">Add to Cart</button>
            <div class="product-description">
                <h3>Description</h3>
                <p id="pdp-product-description">Product description will load here...</p>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-section">
            <h4>About Us</h4>
            <p><a href="#">Our Story</a></p>
            <p><a href="#">Careers</a></p>
        </div>
        <div class="footer-section">
            <h4>Contact Us</h4>
            <p><a href="#">Email Support</a></p>
            <p><a href="#">FAQs</a></p>
        </div>
        <div class="footer-section">
            <h4>Follow Us</h4>
            <p>FB, IG, TW</p>
        </div>
    </footer>
    <script src="js/common.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/product-detail.js"></script>
</body>
</html>
